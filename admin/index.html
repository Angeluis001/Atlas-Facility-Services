<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Atlas Admin · Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
  <link rel="icon" type="image/png" href="/assets/logo.png" />
</head>
<body class="login-body">
  <div class="login-bg" aria-hidden="true"></div>
  <main class="login-card">
    <img src="/assets/logo.png" alt="Atlas" class="login-logo" width="72" height="72" />
    <h1>Panel Atlas</h1>
    <p class="login-sub">Solo personal autorizado · Facility Services</p>
    <form id="loginForm" class="login-form" autocomplete="on">
      <label>
        <span>Email</span>
        <input type="email" name="email" id="email" required placeholder="tu@email.com" autocomplete="username" />
      </label>
      <label>
        <span>Contraseña</span>
        <input type="password" name="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
      </label>
      <p class="login-error" id="loginError" hidden></p>
      <button type="submit" class="btn-primary" id="loginBtn">Entrar al panel</button>
    </form>
  </main>
  <script>
    (async () => {
      try {
        const me = await fetch("/api/auth/me", { credentials: "include" });
        if (me.ok) {
          const data = await me.json();
          if (data.ok) location.replace("/admin/app");
        }
      } catch {}
    })();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("loginError");
      const btn = document.getElementById("loginBtn");
      err.hidden = true;
      btn.disabled = true;
      btn.textContent = "Entrando…";
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "Error de acceso");
        location.href = "/admin/app";
      } catch (ex) {
        err.textContent = ex.message;
        err.hidden = false;
        btn.disabled = false;
        btn.textContent = "Entrar al panel";
      }
    });
  </script>
</body>
</html>
